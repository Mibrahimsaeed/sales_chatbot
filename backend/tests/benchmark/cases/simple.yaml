# Single-metric leaderboard phrasings across the ontology.
# expect.sql values derived by hand from fixture_data.py's docstring table.
- id: simple-001
  tags: [simple, leaderboard]
  query: "top 5 advisors by revenue"
  expect:
    intent: leaderboard
    ir: {metric: mtd_cleared, subject_level: advisor, limit: 5}
    sql: {row_count: 5, first_row: {name: "Waqar Haider", value: 900}}

