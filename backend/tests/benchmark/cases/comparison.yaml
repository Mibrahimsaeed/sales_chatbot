# Comparisons between named subjects.
- id: compare-001
  tags: [comparison, team]
  query: "compare Blue Area with Downtown on revenue"
  expect:
    intent: comparison
    entities: {teams: ["Blue Area", "Downtown"]}
    ir: {metric: mtd_cleared, subject_level: team}
    sql: {row_count: 2, first_row: {name: "Blue Area", value: 1600}}

- id: compare-002
  tags: [comparison, team]
  query: "Blue Area vs DHA Phase 5 attendance rate"
  expect:
    intent: comparison
    entities: {teams: ["Blue Area", "DHA Phase 5"]}
    ir: {metric: attendance_rate, subject_level: team}
    sql: {row_count: 2, first_row: {name: "Blue Area", value: 85}}

- id: compare-003
