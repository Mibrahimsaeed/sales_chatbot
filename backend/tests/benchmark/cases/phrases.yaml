# Business-language phrasings (P2): no literal metric name in the text.
- id: phrase-001
  tags: [phrases]
  query: "who is the best performer"
  expect:
    intent: leaderboard
    ir: {metric: achievement_pct, subject_level: advisor}
    sql: {first_row: {name: "Waqar Haider", value: 90}}

- id: phrase-002
  tags: [phrases]
  query: "show me the underperforming advisors"
  expect:
    intent: leaderboard
    ir: {metric: achievement_pct, subject_level: advisor, sort_direction: asc}
    sql: {first_row: {name: "Omar Farooq", value: 25}}

- id: phrase-003
  tags: [phrases]
  query: "advisors who almost achieved their target"
  expect:
    ir: {metric: achievement_pct}
    sql: {row_count: 2}

