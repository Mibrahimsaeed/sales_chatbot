[pytest]
testpaths = app etl tests test_intent_detector.py
python_files = test_*.py
# HERMETIC BY DEFAULT. Neither of these markers runs unless asked for by
# name, so `pytest` — locally or in CI — makes no billable provider call
# and produces the same result on every machine. conftest.py's
# `_hermetic_llm_provider` fixture enforces the same property at the
# credential, so a test that forgets the marker cannot reach the network
# either.
addopts = -m "not benchmark and not live"
markers =
    benchmark: NL benchmark against the real LLM (run explicitly: pytest tests/benchmark -m benchmark -s)
    live: exercises the REAL LLM provider over the network — costs money and is
        non-deterministic. Never collected by default; run explicitly with
        `pytest -m live`. Use this only for tests whose subject IS the model's
        behaviour; a test that merely needs *an* IR should build one or patch
        the seam instead.
